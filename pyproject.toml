[project]
name = "wxlocal"
version = "0.1.0"
description = "wxlocal — Windows 微信 PC 本地数据采集（解密、订阅号 IndexedDB、联系人导出）。自学习/研究，见 DISCLAIMER。 | Windows tooling for WeChat PC local data: decrypt, mp-scroll, chat-watch."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "NinjaSin Labs" }]
keywords = ["wechat", "wxlocal", "wcdb", "indexeddb", "decryption"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
]

dependencies = [
    "pycryptodome>=3.20.0",
    "zstd>=1.5.0",
    "sqlcipher3>=0.6.0",
    "flask>=3.0.0",
    "mitmproxy>=11.0.0",
    "chromium-reader>=0.1.1",
]

[project.optional-dependencies]
ocr = [
    "opencv-python>=4.8.0",
    "numpy>=1.26.0",
    "rapidocr-onnxruntime>=1.3.0",
    "onnxruntime>=1.16.0",
    "pillow>=10.0.0",
]
leveldb = ["plyvel-ci>=1.5.0"]
dev = ["pytest>=8.0.0"]

[project.urls]
Homepage = "https://github.com/NinjaSln-labs/wxlocal"
Documentation = "https://github.com/NinjaSln-labs/wxlocal/blob/main/docs/STANDALONE.md"
Issues = "https://github.com/NinjaSln-labs/wxlocal/issues"

[project.scripts]
wxlocal-watch = "wxlocal.pipelines.chat_watch.daemon:main"
wxlocal-mp-scroll = "wxlocal.pipelines.mp_scroll.daemon:main"
wxlocal-export = "wxlocal.export.cli:main"
wxlocal-web = "wxlocal.web.app:main"

[tool.setuptools.packages.find]
include = ["wxlocal*", "mp_capture*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
